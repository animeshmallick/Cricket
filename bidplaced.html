<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bid Placed Successfully</title>
    <style>
        /* General Styles */
        body {

            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
            opacity: 0;
            animation: fadeIn 1.5s ease-out forwards;
        }
        div.root {
            overflow-x: hidden; /* Prevent horizontal scroll */
            background-image: url('./images/stadium2.png'); /* Set the local background image */
            background-size: cover; /* Cover the entire page */
            background-position: inherit; /* Center the background */
            background-attachment: fixed; /* Keep the background fixed during scrolling */
            background-repeat: no-repeat; /* Prevent repeating the background */
            z-index: 0; /* Ensure the background stays behind content */
            width: 100%;
            background-color: rgba(143, 174, 143, 0.29);
            margin-left: 0.2rem;
            margin-right: 0.2rem;
        }

        /* Page Fade-in effect */
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* Breathe animation */
        @keyframes breathe-slots {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1);  }
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @keyframes fadeColor {
            0% {
                background-color: rgba(237, 199, 70, 0.6);
            }
            50% {
                background-color: rgba(255, 193, 7, 0.6);
            }
            100% {
                background-color: rgba(218, 189, 85, 0.62);
            }
        }

        @keyframes breathe {
            0% {
                background-color: #18bfbf;
            }
            /* Dark blue */
            100% {
                background-color: rgba(52, 98, 234, 0.6);
            }
        }
        /* Hero Section */
        .hero {
            justify-items: center;
            width:100%;
            overflow-x: hidden; /* Prevent horizontal scroll */
            background-image: url('./images/stadium2.png'); /* Set the local background image */
            background-size: cover; /* Cover the entire page */
            background-position: center; /* Center the background */
            background-attachment: fixed; /* Keep the background fixed during scrolling */
            background-repeat: no-repeat; /* Prevent repeating the background */
            z-index: 0; /* Ensure the background stays behind content */
            display: flex;
            flex-direction: row;
            text-align: center;
            margin-left: 0.2rem;
            margin-right: 0.2rem;
            margin-bottom: 0.2rem;
            padding: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.8);
            border-radius: 8px;
        }

        .hero h1 {
            text-align: center;
            font-family: 'Poppins', sans-serif;
            font-size: 1.8rem;
            color: #4CAF50;
            animation: breathe-slots 2s infinite ease-in-out;
            margin: 0.2rem;
            padding: 0.2rem;
        }


        /* Checkmark Icon Animation */
        .checkmark-icon {
            justify-content: center;
            width: 35px;
            height: 35px;
            border: 6px solid #4CAF50;
            border-radius: 50%;
            margin: 0.2rem;
            position: relative;
            animation: checkmarkAnim 0.8s ease-out forwards, bounce 2s ease-out forwards, breathe-slots 2s infinite ease-in-out;
        }

        .checkmark-icon::after {
            content: '';
            position: relative ;
            left: 0px;
            top: 10px;
            width: 10px;
            height: 10px;
            border: solid #4CAF50;
            border-width: 0 0 5px 5px;
            transform: rotate(45deg);
            opacity: 1;
            animation: checkmarkDraw 0.8s 0.3s forwards;
        }

        /* Checkmark Drawing Animation */
        @keyframes checkmarkAnim {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes checkmarkDraw {
            0% { opacity: 0; width: 0; }
            100% { opacity: 1; width: 25px; }
        }

        /* Bounce animation */
        @keyframes bounce {
            0% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
            50% {
                transform: translateY(0);
            }
            70% {
                transform: translateY(-5px);
            }
            100% {
                transform: translateY(0);
            }
        }
        .cta-button {
            display: inline-block;
            padding: 0.2rem;
            background-color: #069727;
            color: rgba(14, 14, 14, 0.62);
            text-decoration: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            margin-left: 3rem;
            margin-right: 3rem;
            margin-bottom: 0.5rem;
            transition: transform 0.3s ease, background-color 0.3s ease;
            animation: breathe-slots 1s infinite ease-in-out;
        }

        .cta-button:hover {
            transform: scale(1.03);
            background-color: #48bf34;
        }

        div.bid-summary {
            overflow-x: hidden; /* Prevent horizontal scroll */
            background-image: url('./images/stadium1.png'); /* Set the local background image */
            background-size: cover; /* Cover the entire page */
            background-position: center; /* Center the background */
            background-attachment: fixed; /* Keep the background fixed during scrolling */
            background-repeat: no-repeat; /* Prevent repeating the background */
            z-index: 0; /* Ensure the background stays behind content */

            margin-left: 0.2rem;
            margin-right: 0.2rem;
            margin-bottom: 0.2rem;
            text-align: center;
            font-size: 1.4rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.8);
            border-radius: 8px;
        }
        div.bid-summary-header {
            color: rgba(236, 229, 203, 0.62);
            background-color: rgba(18, 67, 18, 0.29);
            box-shadow: 0 4px 6px rgba(11, 69, 67, 0.8);
            border-radius: 8px;
            padding: 0.2rem;
            margin-bottom: 0.2rem;
            font-size: 1.8rem;
            font-weight: 700;
            opacity: 1;
        }

        div.bid-details {
            display: flex;
            flex-direction: column;
            font-family: 'Poppins', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            background-color: #559fea;
            border-radius: 8px;
            padding: 0.2rem;
            animation: breathe 2s infinite ease-in-out;
        }

        div.bid-amount {
            display: flex;
            flex-direction: column;
            font-family: 'Poppins', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            background-color: rgb(92, 103, 97);
            border-radius: 8px;
            padding: 0.2rem;
            margin-top: 0.1rem;
            margin-bottom: 0.5rem;
        }

        .bid-session {
            margin-bottom: 0.5rem;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            background-color: #18bfbf;
        }
        .next-steps {
            display: flex;
            flex-direction: column;
            transform: translateX(-50px);
            transition: transform 0.6s ease;
            margin-top: 0.5rem;
            text-align: center;
            padding-right: 0.5rem;
            padding-left: 0.5rem;
        }

        .next-steps.visible {
            transform: translateX(0);
        }


    </style>
</head>
<body>

<main>
    <div class="root">
        <div class="hero">
            <span class="checkmark-icon"></span>
            <h1>Bid placed successfully!</h1>

        </div>

        <div class="bid-summary">
            <div class="bid-summary-header">Bid Summary</div>
            <div class="bid-details">
                <span class="bid-session">Bid placed for Session 1</span>
                <span>Runs less than 50</span>
                <span>Put ₹100 get ₹200</span>
            </div>
            <div class="bid-amount">Bid Amount: ₹100.00</div>
        </div>

        <div class="next-steps">
            <a href="#" class="cta-button">Place New Bid</a>
            <a href="#" class="cta-button">All Bids</a>
        </div>
    </div>
</main>

<script>
    // IntersectionObserver for scroll animations
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
            }
        });
    }, {
        threshold: 0.5,
    });

    // Target sections to animate on scroll
    const bidSummary = document.querySelector('.bid-summary');
    const nextSteps = document.querySelector('.next-steps');

    observer.observe(bidSummary);
    observer.observe(nextSteps);
</script>
</body>
</html>
