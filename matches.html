<body onload="fill_header()">
<div id="header"></div>
<section id="matches" class="matches">
  <div class="container">
    <h2>Select Match</h2>
    <ul id="match-list" class="match-list">
      <!-- Matches will be populated dynamically here -->
    </ul>
  </div>

<script>
  // Sample JavaScript to load ongoing matches dynamically
  document.addEventListener('DOMContentLoaded', function () {
    const matchList = document.getElementById('match-list');

    // Sample data (replace with actual API or real-time data)
    const ongoingMatches = [
      {
        teams: ['India vs Pakistan'],
        status: 'Ongoing',
        score: '150/4 (15 overs)',
        type: 'ongoing',
        url: 'https://example.com/match/india-vs-pakistan'  // Example URL
      },
      {
        teams: ['Australia vs England'],
        status: 'Yet to start',
        score: 'N/A',
        type: 'yet-to-start',
        url: 'https://example.com/match/australia-vs-england'  // Example URL
      },
      {
        teams: ['South Africa vs New Zealand'],
        status: 'Completed',
        score: '250/8 (20 overs)',
        type: 'completed',
        url: 'https://example.com/match/south-africa-vs-new-zealand'  // Example URL
      }
    ];

    // Function to create match cards
    function createMatchCard(match) {
      const matchCardWrapper = document.createElement('a');
      matchCardWrapper.classList.add('match-card');
      matchCardWrapper.href = match.url; // Set the redirect URL
      matchCardWrapper.target = '_blank'; // Open the link in a new tab

      // Assign classes based on the match type
      if (match.type === 'ongoing') {
        matchCardWrapper.classList.add('ongoing');
      } else if (match.type === 'yet-to-start') {
        matchCardWrapper.classList.add('yet-to-start');
      } else if (match.type === 'completed') {
        matchCardWrapper.classList.add('completed');
      }

      const teams = document.createElement('h3');
      teams.textContent = match.teams.join(' vs ');
      matchCardWrapper.appendChild(teams);

      const score = document.createElement('p');
      score.textContent = `Score: ${match.score}`;
      matchCardWrapper.appendChild(score);

      const status = document.createElement('p');
      status.textContent = `Status: ${match.status}`;
      matchCardWrapper.appendChild(status);

      // Add live flag to ongoing matches
      if (match.type === 'ongoing') {
        const liveFlag = document.createElement('span');
        liveFlag.classList.add('live-flag');
        liveFlag.textContent = 'LIVE';
        matchCardWrapper.appendChild(liveFlag);
      }

      matchList.appendChild(matchCardWrapper);

      // Trigger animation on page load
      setTimeout(() => {
        matchCardWrapper.style.transform = 'translateY(0)';
        matchCardWrapper.style.opacity = '1';
      }, 300); // Delay animation for smooth effect
    }

    // Load all ongoing matches
    ongoingMatches.forEach(match => {
      createMatchCard(match);
    });
  });

  async function fill_header(){
    fetch('model_ui/header/header.php')
            .then(async response => document.getElementById('header').innerHTML = await response.text())
            .then(() => {
              const hamburger = document.querySelector('.hamburger');
              const navLinks = document.querySelector('.nav-links');
              hamburger.addEventListener('click', () => {
                navLinks.classList.toggle('active');
                hamburger.classList.toggle('active');
              });
            })
            .catch(error => console.log(error));
  }
</script>
